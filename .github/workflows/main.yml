# CI/CD: test on PR, build+deploy on merge
name: Book Analytics API — CI/CD
run-name: Automatic deployment on merge to main

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Seed demo DB
        run: python scripts/seed.py

      - name: Run tests
        run: pytest tests/ -v --cov=app --cov-report=term-missing

      - name: Capture build tag
        id: buildtag
        run: echo "TAG=$(git describe --always)" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/book-analytics-api
          docker build -f docker/Dockerfile \
            --build-arg GIT_COMMIT=${{ steps.buildtag.outputs.TAG }} \
            --build-arg GIT_BRANCH=${{ github.head_ref }} \
            -t $IMAGE:${{ steps.buildtag.outputs.TAG }} \
            -t $IMAGE:latest .
          docker push $IMAGE:${{ steps.buildtag.outputs.TAG }}
          docker push $IMAGE:latest

      - name: Install kubectl + helm
        uses: azure/setup-kubectl@v3
      
      - name: Install helm
        uses: azure/setup-helm@v3

      - name: Deploy via Helm
        run: |
          cd .charts && helm upgrade --install \
            --set app.imageTag=latest \
            --set podAnnotations.rollme=$(date +%s) \
            -n default book-analytics-api ./